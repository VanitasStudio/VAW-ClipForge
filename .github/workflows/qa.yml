name: ClipForge QA

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  static-and-branding:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile application and tests
        run: python -m compileall -q .
      - name: Validate Vanitas UI contracts
        run: python -m unittest tests.qa_v12_vanitas_controls -v
