name: ClipForge QA

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  static-and-branding:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile application package
        run: python -m compileall -q clipforge
